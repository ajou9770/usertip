<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>진행중 이벤트</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/6478f529f2.js" crossorigin="anonymous"></script>
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', sans-serif;
    }
    .event-card {
      margin-bottom: 2rem;
      border: none;
      border-radius: 0.75rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.06);
    }
    .event-card img {
      border-top-left-radius: 0.75rem;
      border-top-right-radius: 0.75rem;
      max-height: 300px;
      object-fit: cover;
    }
    .event-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .event-btn {
      margin-top: 0.5rem;
    }
    .footer {
      text-align: center;
      font-size: 14px;
      color: #6c757d;
      padding: 1.5rem 0;
    }
  </style>
</head>
<body>

<div class="container py-4">
  <h3 class="text-center mb-4">🎉 현재 진행중인 이벤트</h3>

  <!-- 이벤트 카드 예시 -->
  <div class="card event-card">
    <img src="img/joinevent_2507.jpg" class="card-img-top" alt="신규가입 이벤트" onclick="alert('🙏이벤트는 7월 8일부터 시행합니다. 단, 신입교직원은 즉시 적용됩니다.')">
    <div class="card-body">
      <div class="event-title">🎁 신협 신규가입 이벤트</div>
      <p>2025.7.8 ~ 8.29</p>
      <a href="http://pf.kakao.com/_dfhkK/109933318" class="btn btn-primary event-btn">
        ✔ 자세히 보기 <i class="fas fa-chevron-right"></i>
      </a>
    </div>
  </div>

  <div class="card event-card">
    <img src="https://ajou9770.github.io/notice/img/camp_top.jpg" class="card-img-top" alt="헌혈캠페인">
    <div class="card-body">
      <div class="event-title">💦생명을 살리는 작은 실천! ✨헌혈</div>
      <p>2025.9.12(금)</p>
      <a href="https://ajou9770.github.io/notice/camp" class="btn btn-info event-btn" target="_blank">
        🔎 자세히 보기
      </a>
    </div>
  </div>

  <div class="card event-card">
    <img src="img/salecoupon.jpg" class="card-img-top" alt="세븐일레븐 할인쿠폰" onclick="alert('🤷‍♀️1일부터 카톡홈에서 받으실 수 있습니다.')">
    <div class="card-body">
      <div class="event-title">🛍️ 세븐일레븐 20% 할인쿠폰</div>
      <p>매월 1일~말일</p>
      <a href="http://pf.kakao.com/_dfhkK" class="btn btn-warning text-dark event-btn">
        🎫 쿠폰받기
      </a>
    </div>
  </div>

  <div class="card event-card">
    <img src="img/drawcoupon_2025.jpg" class="card-img-top" alt="신입교직원 우대쿠폰" onclick="alert('🙏신협 카톡홈에서 내려받으실 수 있습니다')">
    <div class="card-body">
      <div class="event-title">🧾 신입교직원 적금 우대 쿠폰</div>
      <p>2025.1.1 ~ 12.31</p>
      <a href="http://pf.kakao.com/_dfhkK" class="btn btn-danger event-btn">
        🎫 쿠폰받기
      </a>
    </div>
  </div>

  <div class="card event-card">
    <img src="img/congrat_img-001.jpg" class="card-img-top" alt="경조금 신청안내">
    <div class="card-body">
      <div class="event-title">💐 경조금 신청 안내</div>
      <p>2023.3.1 ~ 연중</p>
      <a href="http://ajou9770.github.io/usertip/congrat.html" class="btn btn-secondary event-btn">
        🔎 자세히 보기
      </a>
    </div>
  </div>

  <div class="card event-card">
        <img src="https://blog-static.kkday.com/ko/blog/wp-content/uploads/sono_hotels_and_resorts_2.jpg" class="card-img-top" alt="소노호텔앤리조트">
   
    <div class="card-body">
      <div class="event-title">🏕️ 소노호텔앤리조트 실시간예약</div>
      <a href="http://ajou9770.github.io/usertip/dm.html" class="btn btn-dark event-btn">
        바로가기
      </a>
    </div>
  </div>

  <div class="text-center mt-5">
    <div class="text">📲 카카오톡 채널 추가 & 상담</div>
    <br>
    <div id="kakao-talk-channel-add-button" data-channel-public-id="_dfhkK" data-size="large"></div>
    <div class="mt-2" id="kakao-talk-channel-chat-button" data-channel-public-id="_dfhkK" data-title="consult" data-size="small" data-color="yellow" data-shape="mobile"></div>
    <a href="https://ajou9770.github.io/usertip/" class="btn btn-outline-primary mt-3">
      <i class="fas fa-chevron-left"></i> 🔗홈으로 가기
    </a>
  </div>

</div>

<!-- 카카오톡 스크립트 -->
<script>
  window.kakaoAsyncInit = function () {
    Kakao.Channel.createAddChannelButton({container: '#kakao-talk-channel-add-button'});
    Kakao.Channel.createChatButton({container: '#kakao-talk-channel-chat-button'});
  };
  (function (d, s, id) {
    var js, fjs = d.getElementsByTagName(s)[0];
    if (d.getElementById(id)) return;
    js = d.createElement(s);
    js.id = id;
    js.src = 'https://developers.kakao.com/sdk/js/kakao.channel.min.js';
    fjs.parentNode.insertBefore(js, fjs);
  })(document, 'script', 'kakao-js-sdk');
</script>

</body>
</html>
